# Release pipeline for the public PyPI package.
#
# Trust boundaries:
# - A GitHub Release must point at a commit reachable from protected main.
# - Individual commits need not be signed; the signed release tag is the
#   release identity and is verified separately from commit authorship.
# - The SSH signer allowlist is loaded from protected main, not from the tag
#   checkout, so a release tag cannot replace its own trust anchor.
# - A release rerun after signer rotation requires protected main to retain the
#   former public key in .allowed_signers.
# - The tag version must match pyproject.toml exactly.
# - Build, SBOM, checksums, and attestations all refer to the same downloaded
#   workflow artifact.
# - PyPI receives credentials only through its narrowly scoped environment and
#   OIDC trusted publishing; this repository stores no publishing token.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify signed tag and build release
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Verify signed tag and release identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact vX.Y.Z version: $RELEASE_TAG"
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG"
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "$RELEASE_TAG does not point to a commit on protected main"
            exit 1
          fi

          TRUSTED_SIGNERS="$RUNNER_TEMP/validibot-allowed-signers"
          git show origin/main:.allowed_signers > "$TRUSTED_SIGNERS"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "$TRUSTED_SIGNERS"
          git verify-tag "$RELEASE_TAG"

          PACKAGE_VERSION="$(python3 -c \
            'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "v$PACKAGE_VERSION" != "$RELEASE_TAG" ]]; then
            echo "pyproject.toml version $PACKAGE_VERSION does not match $RELEASE_TAG"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"

      - name: Set up Python
        run: uv python install 3.13

      - name: Recreate the locked runtime environment
        run: uv sync --frozen

      - name: Build distributions without local source overrides
        run: uv build --no-sources

      - name: Validate distributions
        run: |
          uvx --from twine==7.0.0 twine check --strict dist/*
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"

      - name: Generate CycloneDX SBOMs from the locked environment
        run: |
          mkdir -p sbom
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            .venv/bin/python \
            --output-format JSON \
            --output-file sbom/validibot-shared.cdx.json
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            .venv/bin/python \
            --output-format XML \
            --output-file sbom/validibot-shared.cdx.xml

      - name: Record release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum *
          ) > SHA256SUMS
          (
            cd sbom
            sha256sum *
          ) >> SHA256SUMS

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            dist/
            sbom/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    name: Attest and attach release evidence
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle

      - name: Attest distributions and their SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/validibot-shared.cdx.json

      - name: Attach distributions, SBOMs, and checksums to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/* \
            sbom/validibot-shared.cdx.json \
            sbom/validibot-shared.cdx.xml \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-pypi:
    name: Publish verified distributions to PyPI
    needs: release-evidence
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/validibot-shared/
    permissions:
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle

      - name: Publish to PyPI with provenance attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install locked security tooling
        run: uv sync --frozen --extra dev --python 3.13

      - name: Detect private keys
        run: >-
          uv run --frozen --extra dev --python 3.13
          pre-commit run detect-private-key --all-files

      - name: Scan tracked files with TruffleHog
        run: >-
          uv run --frozen --extra dev --python 3.13
          pre-commit run trufflehog --all-files

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none

      - name: Analyze Python
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:python"

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run linting
        run: >-
          uv run --frozen --extra dev --python ${{ matrix.python-version }}
          ruff check .

      - name: Run formatting check
        run: >-
          uv run --frozen --extra dev --python ${{ matrix.python-version }}
          ruff format --check .

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: >-
          uv run --frozen --extra dev --python ${{ matrix.python-version }}
          pytest

  deps:
    name: deps (lock + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
      - name: Verify the lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Audit the locked dependency set for known vulnerabilities
        run: |
          uv export --frozen --no-emit-project \
            --quiet \
            --format requirements-txt -o requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            -r requirements-audit.txt \
            --require-hashes \
            --disable-pip \
            --strict

  ci:
    name: ci
    if: always()
    runs-on: ubuntu-latest
    needs: [security, codeql, test, deps]
    steps:
      - name: Require every CI job to pass
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPS_RESULT: ${{ needs.deps.result }}
        run: |
          test "$SECURITY_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$DEPS_RESULT" = "success"

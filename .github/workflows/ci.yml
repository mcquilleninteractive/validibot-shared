name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.5.1
      - name: Detect private keys
        run: pre-commit run detect-private-key --all-files
      - name: Scan tracked files with TruffleHog
        run: pre-commit run trufflehog --all-files

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run linting
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run formatting check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  deps:
    name: deps (lock + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
      - name: Verify the lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Audit the locked dependency set for known vulnerabilities
        run: |
          uv export --frozen --no-emit-project \
            --format requirements-txt -o requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            -r requirements-audit.txt \
            --no-deps \
            --disable-pip

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [security, test, deps]
    steps:
      - run: echo "All checks passed."
